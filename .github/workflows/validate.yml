name: Validate HTML & Links

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v6
        with:
          root: .

      - name: Check broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose .
